# Compact sparse packet for mobile-automation.
# Omit unknown/default fields in real packets. Keep secrets as refs only.

v: 1
status: ready # ready | ready_warn | blocked
intent: "Prepare mobile app screenshots, auth, and push setup before store submission."

platforms: [ios, android] # ios | android
framework: expo # native-ios | native-android | react-native | expo | flutter | capacitor | other

app:
  name: "Super App"
  ios_bundle: com.acme.app
  android_package: com.acme.app
  apple_team_id: TEAM123456
  firebase_project: acme-mobile
  expo_project_id: null

assets:
  status: ready
  provider: maestro # maestro | fastlane | xcrun-adb | detox | appium | firebase-test-lab | manual
  capture_plan: scratchpad/mobile-capture-plan.yaml
  output: store/screenshots
  locales: [en-US]
  ios_devices: ["iphone_6_9"]
  android_devices: ["phone"]
  previews: store/previews
  feature_graphic: store/google/feature-graphic.png
  upload: dry-run # dry-run | prepared | uploaded

auth:
  status: ready_warn
  providers: [apple, google, email]
  firebase: env:GOOGLE_APPLICATION_CREDENTIALS
  apple: env:ASC_API_KEY_JSON
  domains: [example.com]
  universal_links: true
  app_links: true
  reviewer_account: secret:op://Mobile/AppDemo
  risks:
    - "Google OAuth native client creation still needs human console confirmation."

push:
  status: blocked
  provider: fcm # fcm | apns | expo | onesignal | braze | custom | none
  android_fcm: ready
  ios_apns: blocked
  apns_key: ref:missing
  firebase_apns_upload: manual
  real_device_test: pending
  risks:
    - "APNs .p8 key creation and Firebase APNs upload are console-only for this project."

controls:
  action: dry-run # dry-run | execute | resume
  provider_writes: false
  local_edits: true
