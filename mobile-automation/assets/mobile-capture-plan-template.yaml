# Capture plan for mobile-automation.
# Keep test credentials as refs only.

v: 1
provider: maestro # maestro | fastlane | xcrun-adb | detox | appium | firebase-test-lab
output: screenshots

app:
  ios_bundle: com.acme.app
  android_package: com.acme.app
  launch_args: []
  demo_account: secret:op://Mobile/AppDemo

locales:
  - en-US

devices:
  ios:
    - name: "iPhone 16 Pro Max"
      device_class: large_iphone
      orientation: portrait
  android:
    - name: "Pixel 9 Pro"
      device_class: android_phone
      orientation: portrait

scenes:
  - id: onboarding
    title: "Onboarding"
    route: "acme://onboarding"
    flow: ".maestro/onboarding.yaml"
    outputs:
      ios: "ios/{locale}/large-iphone/01-onboarding.png"
      android: "android/{locale}/phone/01-onboarding.png"
  - id: home
    title: "Home"
    route: "acme://home"
    flow: ".maestro/home.yaml"
    outputs:
      ios: "ios/{locale}/large-iphone/02-home.png"
      android: "android/{locale}/phone/02-home.png"

videos:
  - id: core-flow
    flow: ".maestro/core-flow.yaml"
    output: "videos/{locale}/core-flow.mp4"
    max_seconds: 30

validation:
  screenshots:
    formats: [png, jpg, jpeg]
    non_empty: true
  videos:
    formats: [mp4, mov]
    max_seconds: 30
